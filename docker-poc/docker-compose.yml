# 用法：cd docker-poc && docker compose up --build
# 然后访问 http://demo.localhost:8787 （*.localhost 现代浏览器自动解析到 127.0.0.1；
# 手机/其他设备访问时把 tenants.json 里的域名换成一个解析到本机 IP 的真域名）
services:
  xwblog:
    build:
      context: ..
      dockerfile: docker-poc/Dockerfile
    ports:
      # 本地默认 8787；独占机器排练期挂 80：XWLBLOG_PORT=80 docker compose up -d
      # 与其他 Web 服务共存的机器（1Panel/openresty 等占 80）只绑回环给反代：
      #   XWLBLOG_BIND=127.0.0.1 docker compose up -d
      - '${XWLBLOG_BIND:-0.0.0.0}:${XWLBLOG_PORT:-8787}:8787'
    environment:
      # 控制面操作日志显式落进挂载卷：缺省路径是 TENANTS_DIR/../ops.log（容器 /data 根，
      # root 属主且不挂卷——应用以 node 跑 appendFileSync 静默 EACCES，容器重建即丢）
      - OPS_LOG_PATH=/data/tenants/ops.log
    volumes:
      # Linux 上宿主目录若为 root 属主，容器入口 entrypoint.sh 会自动 chown 给 node，
      # 宿主机无需任何准备；数据落在 ./data/<域名>/（blog.db + uploads/）
      - ./data:/data/tenants
      # tenants.json 可写：启用控制面（CONTROL_HOST/CONTROL_PASSWORD）时它要热写配置；
      # 纯体验用不到控制面的话可改回 :ro 防误改
      - ./tenants.json:/app/docker-poc/tenants.json
    restart: unless-stopped
